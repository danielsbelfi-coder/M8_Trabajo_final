<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroStock - Consolas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎮 RetroStock</span>
            <button class="btn btn-outline-light btn-sm" id="btnLogout">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Plataformas registradas</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalConsola">
                + Nueva consola
            </button>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="listaConsolas" class="row g-3">
            <!-- Las tarjetas de consolas se insertan aquí por JS -->
        </div>
    </div>

    <!-- Modal: Crear consola -->
    <div class="modal fade" id="modalConsola" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva consola</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="errorModalConsola" class="alert alert-danger d-none" role="alert"></div>
                    <form id="formConsola">
                        <div class="mb-3">
                            <label class="form-label">Fabricante</label>
                            <input type="text" class="form-control" id="fabricante" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="modelo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Generación</label>
                            <input type="number" class="form-control" id="generacion">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/consoles.js"></script>
</body>

</html>
