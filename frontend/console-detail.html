<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroStock - Repuestos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎮 RetroStock</span>
            <button class="btn btn-outline-light btn-sm" id="btnLogout">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container">
        <a href="dashboard.html" class="btn btn-link px-0 mb-3">&larr; Volver a consolas</a>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 id="tituloConsola">Repuestos</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalParte">
                + Nuevo repuesto
            </button>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="listaPartes" class="row g-3">
            <!-- Las tarjetas de repuestos se insertan aquí por JS -->
        </div>
    </div>

    <!-- Modal: Crear repuesto -->
    <div class="modal fade" id="modalParte" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo repuesto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="errorModalParte" class="alert alert-danger d-none" role="alert"></div>
                    <form id="formParte">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Condición</label>
                            <select class="form-select" id="condicion" required>
                                <option value="Nuevo">Nuevo</option>
                                <option value="Extraído/Usado">Extraído/Usado</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen</label>
                            <input type="file" class="form-control" id="imagen" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/parts.js"></script>
</body>

</html>
